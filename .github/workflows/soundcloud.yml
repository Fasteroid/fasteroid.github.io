name: Update Soundcloud Graph

on:
  repository_dispatch:
    types: [soundcloud-rebuild]
  workflow_dispatch:
    inputs: {}

jobs:
  force-push-file:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages:    write
      id-token: write

    steps:

    - name: Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Update Soundcloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash ./src/building/soundcloud/update-soundcloud.sh