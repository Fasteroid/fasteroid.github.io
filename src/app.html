<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-reload="">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

<script>
	// Suppress hydration errors, since sveltekit provides no official way to disable hydration while keeping clientside scripts.
	window.addEventListener('unhandledrejection', (event) => {
		if (event.reason?.message?.includes('hydrate')) {
			event.preventDefault();
		}
	});
</script>
